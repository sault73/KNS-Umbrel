releaseNotes: |-
  KUNAS/Labs 1.2.2: Signal Directory beside Faces.

  - New tab order: Faces, Signal Directory, Recordings, Settings.
  - Remove the sidebar and drawer, restoring full workspace width.
  - Keep independent management targets in each multi-view panel with one shared directory poll.
  - Retain stream selection, Add/Rename/Archive, and direct archived-history navigation.
  - Preserve keyboard tab navigation, unique control IDs, and management-form focus restoration.
  - Tab changes do not restart players or change recording/analysis.
  - Update screenshots; preserve existing stream keys, recordings, data, and ports.

  Automatic recording remains enabled by default as in 1.2.0, including for
  already-live feeds after updates/restarts. AUTO_RECORD=false keeps manual-only
  recording. A manual Stop is not a persistent opt-out across backend restarts.

  Back up and update the existing app; do not uninstall. Reload the dashboard
  afterward to see the new tab order. Face analysis remains separately opt-in.
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: AUTO_RECORD
    services: [backend]
    default: "true"
    options: ["true", "false"]
    note: Automatically record live streams, including after restart. Stop suppresses recording until that publisher reconnects. Set false for manual-only recording.
  - name: PUBLIC_HOST
    services: [backend]
    default: umbrel.local
    note: Advertised OBS hostname or IPv4 address only, without scheme, port, or path. Uses the device's .local hostname unless overridden here; use a LAN/VPN address if OBS cannot resolve it. This does not change the RTMP bind address.
  - name: COOKIE_SECURE
    services: [backend]
    default: "false"
    note: Set true only when accessing the dashboard through HTTPS. Secure cookies prevent login over ordinary HTTP.
  - name: MIN_FREE_GB
    services: [backend]
    default: "2"
    note: Free-space reserve in GiB (0.05 to 1000000). Low space stops recording and pauses analysis; this is not a quota and does not delete recordings.
  - name: FACE_RETENTION_DAYS
    services: [backend]
    default: "7"
    note: Retain face data for 1 to 365 days. This does not delete or redact video recordings.
  - name: MAX_FACES
    services: [backend]
    default: "2000"
    note: Maximum stored face groups across all streams, including archived history (1 to 10000).
  - name: MATCH_THRESHOLD
    services: [backend]
    default: "0.5"
    note: Face-group cosine similarity threshold, greater than 0 and at most 1. Similarity is not an identity verification or a probability.
  - name: DETECTION_THRESHOLD
    services: [backend]
    default: "0.85"
    note: Face detection confidence threshold, greater than 0 and at most 1.
  - name: ANALYSIS_FPS
    services: [backend]
    default: "2"
    note: Per-stream capture target from 0.2 to 10 FPS. Achieved analysis rate depends on hardware and load across all feeds; analysis requires opt-in after restart.
