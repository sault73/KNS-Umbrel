manifestVersion: 1
id: kunas-steamlab
name: KUNAS/Labs
tagline: Monitor OBS streams, record video, and group faces with NVIDIA acceleration
icon: https://raw.githubusercontent.com/9vibes/SteamLab/v1.1.0/assets/icon.svg
category: media
version: "1.1.0"
port: 28081
description: >-
  KUNAS/Labs is a self-hosted OBS dashboard with authenticated live
  playback, manual MP4 recording, and optional face grouping. This package requires
  Linux x86-64, an NVIDIA GPU, a driver compatible with CUDA 12.4, and NVIDIA
  Container Toolkit configured for Docker. It does not fall back to CPU and is not
  compatible with ARM devices such as Umbrel Home ARM or Raspberry Pi.


  Previously named SteamLab NVIDIA. Update your existing installation to keep
  recordings, face data, credentials, and stream settings; no reinstall is needed.


  Version 1.1.0 supports up to four active feeds with matching backend, frontend,
  worker, and MediaMTX configuration delivered together. No additional ingest
  port, container, or app ID change is required. The existing feed becomes Stream 1
  with its key preserved. Migration backfills existing face, session, and recording
  ownership to Stream 1 without moving or overwriting files or replacing its key.


  Add and rename feeds; select a feed to view it and copy its individual OBS key.
  Selection does not interrupt other server feeds: analysis toggles, recording,
  bitrate monitoring, and face groups are independent. Archive an additional feed
  only when offline and not recording, with MediaMTX reachable and confirming no
  pending publisher. Stream 1 cannot be archived. Archive retains face, session,
  and recording history and frees an active slot; it disables ingest and analysis,
  and there is no restore endpoint.


  MAX_FACES is a shared total including archived face groups, and all feeds share
  the low-disk reserve. One initialized NVIDIA engine fairly round-robins bounded
  latest-frame slots from up to four independent FFmpeg decoders. Achieved analysis
  FPS depends on hardware and load; the capture target is not a throughput guarantee.
  The tested CUDA 12.4.1/cuDNN 9.1 and FFmpeg 4.4 RTSP compatibility are retained.


  Log in with the generated application password shown by Umbrel; no username is
  required. In Settings, copy the server URL and complete stream key into OBS,
  including the credentials in the key. Use H.264 video, AAC audio, and a 1-second
  keyframe interval. The dashboard uses port 28081 and RTMP ingest uses TCP 21935.


  RTMP is plaintext and listens on host interfaces for LAN/VPN encoders. Never
  forward port 21935 through your router or expose it to the public Internet.
  Use a VPN for remote publishing and HTTPS or a trusted private network for the
  dashboard. Tor browser access does not provide Tor RTMP ingest.


  Face thumbnails and embeddings are sensitive biometric data. Obtain consent
  before opting in to analysis in the Faces tab. Analysis is disabled initially
  and after every backend restart. Face groups are not verified identities.
  Recording is manual and never automatically resumes. Deleting face data does
  not redact existing recordings, and recordings are never automatically deleted.
developer: 9vibes
website: https://github.com/9vibes/SteamLab
submitter: 9vibes
submission: https://github.com/9vibes/KNS-Umbrel
repo: https://github.com/9vibes/SteamLab
support: https://github.com/9vibes/SteamLab/issues
gallery:
  - https://raw.githubusercontent.com/9vibes/SteamLab/v1.1.0/assets/screenshot-dashboard.png
  - https://raw.githubusercontent.com/9vibes/SteamLab/v1.1.0/assets/screenshot-mobile.png
releaseNotes: |-
  KUNAS/Labs 1.1.0: up to four concurrent streams.

  - Add, rename, select, and archive streams from the dashboard, with four active feeds maximum.
  - Independent publishing keys, playback, bitrate, recording controls, and face catalogs.
  - Switching views does not stop other feeds; four streams can record at once.
  - Existing video, face data, and credentials migrate to Stream 1 without moving recording files or changing its publishing key.
  - Archived additional streams retain their history and free an active slot.
  - Shared-engine analysis uses bounded frame buffers and timed, cancellable delivery, with per-stream errors.
  - Retain CUDA 12.4.1/cuDNN 9.1, FFmpeg 4.4 client-timeout compatibility, and strict CUDA checks.

  Stop recording and back up the complete stopped app before updating. Update the
  existing app, do not uninstall it. Reload the dashboard and re-enable analysis
  for each desired feed afterward. This update migrates the database schema;
  rolling back requires a matching pre-upgrade data backup, not older images alone.
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: PUBLIC_HOST
    services: [backend]
    default: umbrel.local
    note: Advertised OBS hostname or IPv4 address only, without scheme, port, or path. Uses the device's .local hostname unless overridden here; use a LAN/VPN address if OBS cannot resolve it. This does not change the RTMP bind address.
  - name: COOKIE_SECURE
    services: [backend]
    default: "false"
    note: Set true only when accessing the dashboard through HTTPS. Secure cookies prevent login over ordinary HTTP.
  - name: MIN_FREE_GB
    services: [backend]
    default: "2"
    note: Free-space reserve in GiB (0.05 to 1000000). Low space stops recording and pauses analysis; this is not a quota and does not delete recordings.
  - name: FACE_RETENTION_DAYS
    services: [backend]
    default: "7"
    note: Retain face data for 1 to 365 days. This does not delete or redact video recordings.
  - name: MAX_FACES
    services: [backend]
    default: "2000"
    note: Maximum stored face groups across all streams, including archived history (1 to 10000).
  - name: MATCH_THRESHOLD
    services: [backend]
    default: "0.5"
    note: Face-group cosine similarity threshold, greater than 0 and at most 1. Similarity is not an identity verification or a probability.
  - name: DETECTION_THRESHOLD
    services: [backend]
    default: "0.85"
    note: Face detection confidence threshold, greater than 0 and at most 1.
  - name: ANALYSIS_FPS
    services: [backend]
    default: "2"
    note: Per-stream capture target from 0.2 to 10 FPS. Achieved analysis rate depends on hardware and load across all feeds; analysis requires opt-in after restart.
