manifestVersion: 1
id: kunas-steamlab
name: KUNAS/Labs
tagline: Watch four live feeds in multi-view with automatic recording
icon: https://raw.githubusercontent.com/9vibes/SteamLab/v1.2.2/assets/icon.svg
category: media
version: "1.2.2"
port: 28081
description: >-
  KUNAS/Labs is a self-hosted OBS dashboard with authenticated live
  playback, MP4 recording, and optional face grouping. This package requires
  Linux x86-64, an NVIDIA GPU, a driver compatible with CUDA 12.4, and NVIDIA
  Container Toolkit configured for Docker. It does not fall back to CPU and is not
  compatible with ARM devices such as Umbrel Home ARM or Raspberry Pi.


  Previously named SteamLab NVIDIA. Update your existing installation to keep
  recordings, face data, credentials, and stream settings; no reinstall is needed.


  Version 1.2.2 supports up to four active feeds with matching backend, frontend,
  worker, and MediaMTX configuration delivered together. Existing streams, keys,
  recordings, face catalogs, ports, and the app ID remain unchanged. No additional
  database migration beyond the four-stream schema introduced in 1.1.0 is required.


  Add and rename feeds; select a feed to view it and copy its individual OBS key.
  Selection does not interrupt other server feeds: analysis toggles, recording,
  bitrate monitoring, and face groups are independent. Archive an additional feed
  only when offline and not recording, with MediaMTX reachable and confirming no
  pending publisher. Stream 1 cannot be archived. Archive retains face, session,
  and recording history and frees an active slot; it disables ingest and analysis,
  and there is no restore endpoint.


  MAX_FACES is a shared total including archived face groups, and all feeds share
  the low-disk reserve. One initialized NVIDIA engine fairly round-robins bounded
  latest-frame slots from up to four independent FFmpeg decoders. Achieved analysis
  FPS depends on hardware and load; the capture target is not a throughput guarantee.
  The tested CUDA 12.4.1/cuDNN 9.1 and FFmpeg 4.4 RTSP compatibility are retained.


  IMPORTANT: Video recording is now ON BY DEFAULT. Already-live streams start
  recording after an update or backend restart, even if recording was previously
  stopped manually. To keep manual-only operation, stop encoders before updating,
  set AUTO_RECORD=false in the app's environment settings, apply the setting,
  and only then reconnect encoders. Face analysis remains separately opt-in.


  Multi-view shows only connected, non-archived feeds in a
  2x2 desktop grid or one mobile column. Each named video has recording controls
  and telemetry plus independent Faces, Signal Directory, Recordings, and Settings
  tabs below it. Players start muted. Signal Directory is an inline tab immediately
  beside Faces; the sidebar and drawer are removed. Each panel keeps its own
  management target while sharing the directory list and Add/Rename/Archive forms;
  use Single view for offline settings/history. Selecting archived history switches
  to Single view. Empty Multi-view offers connection guidance. View/tab changes
  never start or stop recording or analysis and do not affect server feeds.


  The backend defaults to AUTO_RECORD=true; set false in deployment
  configuration for manual-only recording. Each monitor starts once a feed is
  confirmed ready, including existing live feeds after backend restart, with the
  same H.264, disk, and authentication guards as manual Start. No viewer is needed.
  Stop suppresses the current publisher fingerprint, including while disk-paused
  without an active recorder, and survives temporary MediaMTX API outages. A genuine
  reconnect clears suppression and starts a new file after the old one is finalized.
  The latch is not a persistent opt-out across backend restarts. Explicit Start
  overrides Stop/failure suppression and retries subject to the guards; it returns
  an already active recording with HTTP 200 rather than creating a duplicate.


  Low disk pauses recording. Automatic recovery requires free space above the
  shared reserve plus headroom for five continuous seconds unless manually stopped.
  Headroom is 10% of the reserve, bounded to 16-256 MiB. Spawn failures or unexpected
  recorder exits latch an error for the same connection until manual Start or a
  genuine reconnect, preventing repeated attempts and file churn. Reconnects cannot
  bypass the storage recovery delay. Single view keeps Stop available during a
  media-server outage when the last publisher can still be suppressed. Start and
  Stop are idempotent, preventing duplicate recordings from concurrent actions.


  Four simultaneous recordings consume storage at the combined rate of all feeds,
  even without an open dashboard. The shared low-disk reserve is not a quota or a
  per-feed allowance. Monitor capacity and manage separate storage/quotas and video
  retention deliberately. Recordings are never automatically deleted, even on low
  disk. Local verification covered automatic startup without viewers, four concurrent
  recorders, sticky Stop, reconnects, storage guards, and desktop/mobile layouts.


  Log in with the generated application password shown by Umbrel; no username is
  required. In Settings, copy the server URL and complete stream key into OBS,
  including the credentials in the key. Use H.264 video, AAC audio, and a 1-second
  keyframe interval. The dashboard uses port 28081 and RTMP ingest uses TCP 21935.


  RTMP is plaintext and listens on host interfaces for LAN/VPN encoders. Never
  forward port 21935 through your router or expose it to the public Internet.
  Use a VPN for remote publishing and HTTPS or a trusted private network for the
  dashboard. Tor browser access does not provide Tor RTMP ingest.


  Face thumbnails and embeddings are sensitive biometric data. Obtain consent
  before opting in to analysis in the Faces tab. Analysis is disabled initially
  and after every backend restart. Face groups are not verified identities.
  Default-on video recording never enables face
  analysis or identity recognition. Deleting face data does not redact existing
  recordings, and face retention does not apply to video recordings.
